spring.application.name=backendAPI

# Carpeta con los .txt del GTFS, relativa a files/backendAPI (debe terminar en /)
renfe.datos=data/

server.error.include-message=always

renfe.api.url.posiciones=https://gtfsrt.renfe.com/vehicle_positions.json
renfe.api.url.horarios=https://gtfsrt.renfe.com/trip_updates.json
renfe.api.url.incidencias=https://gtfsrt.renfe.com/alerts.json

# Tiempo real: se vuelve a pedir cada intervalo-ms; cada petición espera como mucho timeout-ms.
# Con renfe.api.activo=false no se descarga nada (se usa en los tests).
renfe.api.activo=true
renfe.api.intervalo-ms=60000
renfe.api.timeout-ms=5000

# Base de datos local de usuarios (EP-08)
spring.datasource.url=jdbc:h2:file:./data/usuarios_db;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true